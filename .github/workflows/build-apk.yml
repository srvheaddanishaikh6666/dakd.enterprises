```yaml
name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show project structure
        run: |
          echo "===== PROJECT STRUCTURE ====="
          find . -maxdepth 4 -type f | sort
          echo "============================"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Find Gradle wrapper
        run: |
          echo "Searching for gradlew..."

          find . -type f -name "gradlew" -print

          if [ ! -f "./dakd-jarvis/gradlew" ]; then
            echo "ERROR: ./dakd-jarvis/gradlew was NOT found."
            exit 1
          fi

          echo "gradlew found."
          chmod +x ./dakd-jarvis/gradlew

      - name: Check Gradle
        working-directory: ./dakd-jarvis
        run: |
          ./gradlew --version

      - name: Check Android project
        working-directory: ./dakd-jarvis
        run: |
          echo "===== SETTINGS ====="
          ls -la
          echo "===== APP DIRECTORY ====="
          ls -la app || true
          echo "===== GRADLE FILES ====="
          find . -maxdepth 2 \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) -print

      - name: Build Debug APK
        working-directory: ./dakd-jarvis
        run: |
          ./gradlew assembleDebug --stacktrace --info

      - name: Show generated APK
        if: always()
        run: |
          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dakd-jarvis-debug-apk
          path: ./dakd-jarvis/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
