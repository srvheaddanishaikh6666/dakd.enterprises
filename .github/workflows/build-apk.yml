name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build APK Without Wrapper
        run: |
          echo "Listing files..."
          ls -la
          echo "----"
          ls -la dakd-jarvis/ 2>&1 || ls -la */ 2>&1
          # Find build.gradle
          find . -name "build.gradle*" -type f
          # If gradlew missing, generate it or use gradle directly
          if [ -f "./dakd-jarvis/gradlew" ]; then
            cd dakd-jarvis && chmod +x gradlew && ./gradlew assembleDebug
          elif [ -f "./gradlew" ]; then
            chmod +x gradlew && ./gradlew assembleDebug
          else
            echo "gradlew not found, building with gradle directly..."
            # Try to build from wherever build.gradle is
            if [ -d "dakd-jarvis" ]; then
              cd dakd-jarvis && gradle assembleDebug
            else
              gradle assembleDebug
            fi
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dakd-jarvis-apk
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/app/build/outputs/apk/*.apk
            **/build/outputs/apk/**/*.apk
