name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Fix missing env files
        run: |
          echo "Fixing env files..."
          # Check where dakd-jarvis is
          find . -name ".env*" -type f
          # Create missing .env.example if not exists
          if [ -d "dakd-jarvis" ]; then
            cd dakd-jarvis
            if [ ! -f ".env.example" ]; then
              echo "Creating .env.example..."
              if [ -f ".env" ]; then
                cp .env .env.example
              else
                echo "API_KEY=dummy" > .env.example
                echo "BASE_URL=https://example.com" >> .env.example
              fi
            fi
            if [ ! -f ".env" ]; then
              cp .env.example .env 2>/dev/null || echo "DUMMY=1" > .env
            fi
            ls -la .env* 
            cd ..
          else
            # If dakd-jarvis not found, try root
            if [ ! -f ".env.example" ]; then
              echo "API_KEY=dummy" > .env.example
            fi
            if [ ! -f ".env" ]; then
              echo "API_KEY=dummy" > .env
            fi
          fi
      - name: Build APK
        run: |
          if [ -d "dakd-jarvis" ]; then
            cd dakd-jarvis
          fi
          # Try with wrapper if exists, else gradle
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dakd-jarvis-apk
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/**/*.apk
